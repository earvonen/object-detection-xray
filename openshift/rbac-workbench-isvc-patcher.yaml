# Allow the demo workbench SA to patch InferenceServices (promote/canary script
# run from the workbench terminal). deploy.sh also embeds this subject on the
# main xray-isvc-patcher RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xray-isvc-patcher
  namespace: object-detection-xray
  labels:
    app.kubernetes.io/part-of: object-detection-xray
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xray-isvc-patcher
  namespace: object-detection-xray
  labels:
    app.kubernetes.io/part-of: object-detection-xray
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xray-isvc-patcher
subjects:
  - kind: ServiceAccount
    name: xray-pipeline
    namespace: object-detection-xray
  - kind: ServiceAccount
    name: object-detection-workbench
    namespace: object-detection-xray
