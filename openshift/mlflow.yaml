# Lab / demo MLflow tracking server (RHOAI 3.5+).
# Cluster-scoped name must be "mlflow". Apply after DSC mlflowoperator=Managed
# and the mlflows.mlflow.opendatahub.io CRD exists:
#   ./openshift/ensure-platform.sh
#   # or: oc apply -f openshift/mlflow.yaml
#
# Do NOT omit serveArtifacts with file:// artifacts — CRD validation rejects the
# older "minimal" docs snippet (defaultArtifactRoot / serveArtifacts rules).
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: object-detection-xray
spec:
  serveArtifacts: true
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "file:///mlflow/artifacts"
