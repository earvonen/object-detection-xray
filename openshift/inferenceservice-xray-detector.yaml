# Baseline InferenceService for the X-ray detector (ONNX on S3).
# Requires:
#   - KnativeServing installed (openshift/knative-serving.yaml)
#   - ServingRuntime kserve-ovms (openshift/servingruntime-ovms.yaml)
#
# Apply via:
#   ./openshift/apply-inferenceservice.sh
#
# Placeholders substituted by the script (or edit by hand):
#   __NAMESPACE__      default: object-detection-xray
#   __STORAGE_KEY__    OpenShift AI Connection Secret name
#   __STORAGE_PATH__   object key prefix containing model.onnx (no s3:// bucket)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: xray-detector
  namespace: __NAMESPACE__
  annotations:
    serving.kserve.io/deploymentMode: Serverless
    serving.kserve.io/enable-tag-routing: "true"
  labels:
    app.kubernetes.io/name: xray-detector
    app.kubernetes.io/part-of: xray-lifecycle-demo
spec:
  predictor:
    model:
      modelFormat:
        name: onnx
      runtime: kserve-ovms
      protocolVersion: v2
      storage:
        key: __STORAGE_KEY__
        path: __STORAGE_PATH__
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
