# OpenShift AI workbench (Notebook CR) for the X-ray lifecycle demo.
# Auth proxy / MLflow env are injected by the platform when annotations are set.
#
# Placeholders (substituted by apply-notebook.sh / deploy.sh):
#   __NAMESPACE__
#   __WORKBENCH_IMAGE__
#   __CONNECTION_NAME__
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: object-detection-workbench
  namespace: __NAMESPACE__
  labels:
    app: object-detection-workbench
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: xray-lifecycle-demo
  annotations:
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: xray-workbench:latest
    opendatahub.io/image-display-name: "X-ray detector | Minimal CUDA | Python 3.12"
    opendatahub.io/mlflow-instance: mlflow
    # Format required by connection-notebook webhook: namespace/secret-name
    opendatahub.io/connections: __NAMESPACE__/__CONNECTION_NAME__
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    openshift.io/display-name: object-detection-workbench
    openshift.io/description: "Train / track / register X-ray detector (GPU workbench)"
spec:
  template:
    spec:
      containers:
        - name: object-detection-workbench
          image: __WORKBENCH_IMAGE__
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/__NAMESPACE__/object-detection-workbench
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: __WORKBENCH_IMAGE__
          # Cluster URLs/names: openshift/discover-demo-env.sh → ConfigMap xray-demo-env.
          # S3 AWS_*: Connection Secret (also referenced by opendatahub.io/connections for UI).
          # MLflow URI+auth: annotation opendatahub.io/mlflow-instance (injected separately).
          envFrom:
            - configMapRef:
                name: xray-demo-env
                optional: true
            - secretRef:
                name: __CONNECTION_NAME__
                optional: true
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: object-detection-workbench-storage
              mountPath: /opt/app-root/src/
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /notebook/__NAMESPACE__/object-detection-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /notebook/__NAMESPACE__/object-detection-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
      serviceAccountName: object-detection-workbench
      volumes:
        - name: object-detection-workbench-storage
          persistentVolumeClaim:
            claimName: object-detection-workbench-storage
        - name: shm
          emptyDir:
            medium: Memory
